<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Zeus AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f8f9fa; height: 100vh; display: flex; overflow: hidden; }
        .app { display: flex; width: 100%; height: 100vh; }
        .sidebar { width: 240px; background: #1a1a2e; display: flex; flex-direction: column; padding: 1rem; gap: 8px; flex-shrink: 0; }
        .logo { display: flex; align-items: center; gap: 10px; padding-bottom: 1rem; border-bottom: 0.5px solid rgba(255,255,255,0.1); margin-bottom: 0.5rem; }
        .logo-icon { width: 32px; height: 32px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; color: #fff; flex-shrink: 0; }
        .logo-text { color: #fff; font-size: 15px; font-weight: 600; }
        .logo-sub { color: rgba(255,255,255,0.4); font-size: 11px; }
        .new-chat-btn { background: rgba(255,255,255,0.08); border: 0.5px solid rgba(255,255,255,0.15); color: #fff; padding: 9px 12px; border-radius: 8px; font-size: 13px; cursor: pointer; text-align: left; }
        .new-chat-btn:hover { background: rgba(255,255,255,0.12); }
        .sidebar-label { color: rgba(255,255,255,0.3); font-size: 11px; padding: 0.5rem 0.5rem 0.25rem; letter-spacing: 0.5px; }
        .chat-item { padding: 8px 10px; border-radius: 8px; color: rgba(255,255,255,0.6); font-size: 13px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-item.active { background: rgba(255,255,255,0.1); color: #fff; }
        .chat-item:hover { background: rgba(255,255,255,0.07); }
        .sidebar-bottom { margin-top: auto; padding-top: 1rem; border-top: 0.5px solid rgba(255,255,255,0.1); }
        .user-info { display: flex; align-items: center; gap: 8px; padding: 8px; }
        .user-avatar { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, #667eea, #764ba2); display: flex; align-items: center; justify-content: center; font-size: 12px; color: #fff; flex-shrink: 0; }
        .user-name { color: rgba(255,255,255,0.7); font-size: 13px; }
        .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .topbar { padding: 0.875rem 1.25rem; border-bottom: 0.5px solid #e5e7eb; background: #fff; display: flex; align-items: center; justify-content: space-between; }
        .topbar-left { display: flex; align-items: center; gap: 10px; }
        .ai-avatar { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, #667eea, #764ba2); display: flex; align-items: center; justify-content: center; font-size: 16px; color: #fff; }
        .ai-name { font-size: 15px; font-weight: 600; color: #111; }
        .ai-status { font-size: 12px; color: #22c55e; display: flex; align-items: center; gap: 4px; }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; }
        .messages { flex: 1; overflow-y: auto; padding: 1.25rem; display: flex; flex-direction: column; gap: 16px; background: #f8f9fa; }
        .messages::-webkit-scrollbar { width: 4px; }
        .messages::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 4px; }
        .msg-row { display: flex; gap: 10px; align-items: flex-start; }
        .msg-row.user { flex-direction: row-reverse; }
        .msg-avatar { width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; }
        .ai-av { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
        .user-av { background: #e5e7eb; color: #555; }
        .msg-content { display: flex; flex-direction: column; gap: 4px; max-width: 70%; }
        .msg-row.user .msg-content { align-items: flex-end; }
        .sender { font-size: 11px; color: #9ca3af; font-weight: 500; }
        .bubble { padding: 10px 14px; font-size: 14px; line-height: 1.55; border-radius: 12px; }
        .ai-bubble { background: #fff; color: #111; border: 0.5px solid #e5e7eb; border-top-left-radius: 4px; }
        .user-bubble { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border-top-right-radius: 4px; }
        .msg-time { font-size: 11px; color: #d1d5db; }
        .input-area { padding: 1rem 1.25rem; border-top: 0.5px solid #e5e7eb; background: #fff; }
        .input-box { display: flex; align-items: center; gap: 10px; background: #f9fafb; border: 0.5px solid #e5e7eb; border-radius: 12px; padding: 8px 12px; }
        .input-box input { flex: 1; border: none; background: transparent; font-size: 14px; color: #111; outline: none; }
        .input-box input::placeholder { color: #9ca3af; }
        .input-box input:focus { outline: none; }
        .send-btn { width: 34px; height: 34px; border-radius: 8px; background: linear-gradient(135deg, #667eea, #764ba2); border: none; cursor: pointer; color: #fff; font-size: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .send-btn:hover { opacity: 0.85; }
        .typing { display: flex; gap: 4px; align-items: center; padding: 10px 14px; background: #fff; border-radius: 12px; border: 0.5px solid #e5e7eb; border-top-left-radius: 4px; width: fit-content; }
        .dot { width: 6px; height: 6px; border-radius: 50%; background: #d1d5db; animation: bounce 1.2s infinite; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }
        @media (max-width: 600px) { .sidebar { display: none; } }
}
    </style>
</head>
<body>
<div class="app">
    <div class="sidebar">
        <div class="logo">
            <div class="logo-icon">&#9889;</div>
            <div>
                <div class="logo-text">Zeus AI</div>
                <div class="logo-sub">by TerminalAI</div>
            </div>
        </div>
        <button class="new-chat-btn" onclick="clearChat()">&#43; New chat</button>
        <div class="sidebar-label">RECENT</div>
        <div class="chat-item active">Current chat</div>
        <div class="sidebar-bottom">
            <div class="user-info">
                <div class="user-avatar">U</div>
                <div class="user-name">User</div>
            </div>
        </div>
    </div>
    <div class="main">
        <div class="topbar">
            <div class="topbar-left">
                <div class="ai-avatar">&#9889;</div>
                <div>
                    <div class="ai-name">Zeus</div>
                    <div class="ai-status"><div class="status-dot"></div>Online</div>
                </div>
            </div>
        </div>
        <div class="messages" id="msgs">
            <div class="msg-row">
                <div class="msg-avatar ai-av">&#9889;</div>
                <div class="msg-content">
                    <div class="sender">Zeus</div>
                    <div class="bubble ai-bubble">Greetings, mortal! I am Zeus, king of the gods and your AI companion. Ask me anything — I shall enlighten you with both wisdom and wit! &#9889;</div>
                    <div class="msg-time">Just now</div>
                </div>
            </div>
        </div>
        <div class="input-area">
            <div class="input-box">
                <input type="text" id="inp" placeholder="Message Zeus..." />
                <button class="send-btn" onclick="sendMessage()">&#10148;</button>
            </div>
        </div>
    </div>
</div>

<script>
    function getTime() {
        return new Date().toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
    }

    function clearChat() {
        document.getElementById('msgs').innerHTML = `
            <div class="msg-row">
                <div class="msg-avatar ai-av">&#9889;</div>
                <div class="msg-content">
                    <div class="sender">Zeus</div>
                    <div class="bubble ai-bubble">Greetings, mortal! I am Zeus, king of the gods and your AI companion. Ask me anything — I shall enlighten you with both wisdom and wit! &#9889;</div>
                    <div class="msg-time">Just now</div>
                </div>
            </div>`;
    }

    async function sendMessage() {
        const inp = document.getElementById('inp');
        const msgs = document.getElementById('msgs');
        const msg = inp.value.trim();
        if (!msg) return;

        msgs.innerHTML += `
            <div class="msg-row user">
                <div class="msg-avatar user-av">U</div>
                <div class="msg-content">
                    <div class="sender">User</div>
                    <div class="bubble user-bubble">${msg}</div>
                    <div class="msg-time">${getTime()}</div>
                </div>
            </div>`;
        inp.value = '';
        msgs.scrollTop = msgs.scrollHeight;

        msgs.innerHTML += `
            <div class="msg-row" id="typing">
                <div class="msg-avatar ai-av">&#9889;</div>
                <div class="msg-content">
                    <div class="sender">Zeus</div>
                    <div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                </div>
            </div>`;
        msgs.scrollTop = msgs.scrollHeight;

        const response = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: msg })
        });

        const data = await response.json();
        document.getElementById('typing')?.remove();
        msgs.innerHTML += `
            <div class="msg-row">
                <div class="msg-avatar ai-av">&#9889;</div>
                <div class="msg-content">
                    <div class="sender">Zeus</div>
                    <div class="bubble ai-bubble">${data.reply}</div>
                    <div class="msg-time">${getTime()}</div>
                </div>
            </div>`;
        msgs.scrollTop = msgs.scrollHeight;
    }

    document.getElementById('inp').addEventListener('keypress', e => {
        if (e.key === 'Enter') sendMessage();
    });
</script>
</body>
</html>
