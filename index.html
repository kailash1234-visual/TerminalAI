<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TerminalAI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f0f2f5; height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
        .chat-container { width: 100%; max-width: 700px; background: white; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); display: flex; flex-direction: column; height: 580px; }
        .chat-header { padding: 1rem 1.25rem; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 10px; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; background: #e8f0fe; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .header-name { font-size: 15px; font-weight: 600; color: #111; }
        .header-status { font-size: 12px; color: #22c55e; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 12px; }
        .message { display: flex; flex-direction: column; max-width: 75%; }
        .message.user { align-self: flex-end; align-items: flex-end; }
        .message.ai { align-self: flex-start; align-items: flex-start; }
        .bubble { padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.5; }
        .user .bubble { background: #3b82f6; color: white; border-bottom-right-radius: 4px; }
        .ai .bubble { background: #f3f4f6; color: #111; border-bottom-left-radius: 4px; border: 1px solid #e5e7eb; }
        .msg-time { font-size: 11px; color: #9ca3af; margin-top: 4px; }
        .chat-input { padding: 1rem; border-top: 1px solid #eee; display: flex; gap: 8px; align-items: center; }
        .chat-input input { flex: 1; padding: 10px 14px; border-radius: 20px; border: 1px solid #e5e7eb; background: #f9fafb; font-size: 14px; outline: none; }
        .chat-input input:focus { border-color: #3b82f6; }
        .send-btn { width: 38px; height: 38px; border-radius: 50%; background: #3b82f6; border: none; cursor: pointer; color: white; font-size: 16px; display: flex; align-items: center; justify-content: center; }
        .send-btn:hover { background: #2563eb; }
        .typing { display: flex; gap: 4px; align-items: center; padding: 10px 14px; background: #f3f4f6; border-radius: 16px; border-bottom-left-radius: 4px; }
        .dot { width: 6px; height: 6px; border-radius: 50%; background: #9ca3af; animation: bounce 1.2s infinite; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }
    </style>
</head>
<body>
<div class="chat-container">
    <div class="chat-header">
        <div class="avatar">🤖</div>
        <div>
            <div class="header-name">TerminalAI</div>
            <div class="header-status">Online</div>
        </div>
    </div>
    <div class="chat-messages" id="chat-messages">
        <div class="message ai">
            <div class="bubble">Vanakkam da mapla!</div>
            <div class="msg-time">Just now</div>
        </div>
    </div>
    <div class="chat-input">
        <input type="text" id="user-input" placeholder="Type a message..." />
        <button class="send-btn" onclick="sendMessage()">&#10148;</button>
    </div>
</div>

<script>
    function getTime() {
        return new Date().toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
    }

    async function sendMessage() {
        const input = document.getElementById('user-input');
        const messages = document.getElementById('chat-messages');
        const msg = input.value.trim();
        if (!msg) return;

        messages.innerHTML += `<div class="message user"><div class="bubble">${msg}</div><div class="msg-time">${getTime()}</div></div>`;
        input.value = '';
        messages.scrollTop = messages.scrollHeight;

        messages.innerHTML += `<div class="message ai" id="typing"><div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>`;
        messages.scrollTop = messages.scrollHeight;

        const response = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: msg })
        });

        const data = await response.json();
        document.getElementById('typing')?.remove();
        messages.innerHTML += `<div class="message ai"><div class="bubble">${data.reply}</div><div class="msg-time">${getTime()}</div></div>`;
        messages.scrollTop = messages.scrollHeight;
    }

    document.getElementById('user-input').addEventListener('keypress', e => {
        if (e.key === 'Enter') sendMessage();
    });
</script>
</body>
</html>
